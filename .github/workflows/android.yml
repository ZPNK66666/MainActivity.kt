name: Build Android APK 2026

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Получаем код
        uses: actions/checkout@v4

      - name: 2. Устанавливаем JDK 21 (актуальная версия)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: 3. Права для Gradle
        run: chmod +x gradlew

      - name: 4. Собираем APK
        run: ./gradlew assembleDebug --stacktrace

      - name: 5. Сохраняем готовый APK
        uses: actions/upload-artifact@v4
        with:
          name: MyVpnApp
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
